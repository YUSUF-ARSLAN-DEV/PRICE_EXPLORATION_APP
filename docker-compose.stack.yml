# The whole system from the production IMAGES, on one machine (plan 9.9 smoke, 10.x E2E, demos).
#   docker build -f apps/api/Dockerfile -t qarib-api:dev .
#   docker build -f apps/web/Dockerfile -t qarib-web:dev .
#   docker build -f apps/web/Dockerfile --build-arg APP=admin -t qarib-admin:dev .
#   docker compose -f docker-compose.stack.yml up -d
# NOT a production configuration: NODE_ENV=development (demo data visible, Swagger UI on, insecure
# cookies, no malware scanner). Production runs on Azure (infra/terraform).
name: qarib-stack
services:
  db:
    image: pgvector/pgvector:pg16
    environment: { POSTGRES_USER: qarib, POSTGRES_PASSWORD: qarib_local_only, POSTGRES_DB: qarib }
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U qarib']
      interval: 3s
      timeout: 3s
      retries: 20

  meilisearch:
    image: getmeili/meilisearch:v1.11
    environment:
      {
        MEILI_MASTER_KEY: stack_master_key_stack_master_key_32,
        MEILI_ENV: development,
        MEILI_NO_ANALYTICS: 'true',
      }

  mailpit:
    image: axllent/mailpit:latest
    ports: ['8025:8025']

  migrate:
    image: qarib-api:dev
    working_dir: /repo/apps/api
    command:
      [
        'sh',
        '-c',
        'node ../../packages/db/dist/cli.js up && node ../../packages/db/dist/cli.js seed',
      ]
    environment: { DATABASE_URL: 'postgresql://qarib:qarib_local_only@db:5432/qarib' }
    depends_on: { db: { condition: service_healthy } }
    restart: 'no'

  api:
    image: qarib-api:dev
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://qarib:qarib_local_only@db:5432/qarib
      JWT_SECRET: stack-secret-stack-secret-stack-secret-0123
      SHOW_DEMO: 'true'
      APP_URL: http://localhost:3000
      ADMIN_URL: http://localhost:3001
      REFRESH_COOKIE_PATH: /api/v1/auth
      TRUST_PROXY_HOPS: '1'
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
      MEILI_URL: http://meilisearch:7700
      MEILI_MASTER_KEY: stack_master_key_stack_master_key_32
      RATE_LIMIT_PER_MIN: '100000'
      AUTH_RATE_LIMIT_PER_MIN: '100000'
      RECEIPT_DIR: /data/receipts
    ports: ['4000:4000']
    depends_on:
      migrate: { condition: service_completed_successfully }
      meilisearch: { condition: service_started }

  web:
    image: qarib-web:dev
    environment: { API_URL: 'http://api:4000/v1', PORT: '3000' }
    ports: ['3000:3000']
    depends_on: { api: { condition: service_healthy } }

  admin:
    image: qarib-admin:dev
    environment: { API_URL: 'http://api:4000/v1', PORT: '3001' }
    ports: ['3001:3001']
    depends_on: { api: { condition: service_healthy } }
