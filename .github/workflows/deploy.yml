name: Deploy
# Build -> sign -> dev (automatic on main) -> staging -> production (manual approval).
# Plan 9.4. Authentication is OIDC federation (no long-lived cloud keys): create a federated
# credential on an Entra app registration per GitHub Environment and store AZURE_CLIENT_ID /
# AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID as ENVIRONMENT secrets (dev, staging, production).
# DISABLED until the repository variable DEPLOY_ENABLED is set to 'true' (after Azure is provisioned).
# NOT run end-to-end in this repository yet (no Azure subscription was available): first run = DEV.
on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy an existing image tag to this environment'
        type: choice
        options: [dev, staging, production]
      tag:
        description: 'Image tag (defaults to the current commit SHA)'
        required: false

permissions:
  id-token: write
  contents: read
  packages: none

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.sha }}

jobs:
  build:
    if: ${{ vars.DEPLOY_ENABLED == 'true' && !inputs.environment }}
    runs-on: ubuntu-latest
    environment: dev # the DEV registry holds release candidates; promotion re-tags, never rebuilds
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: docker/setup-buildx-action@v3
      - uses: sigstore/cosign-installer@v3
      - name: registry login
        run: az acr login --name "${{ vars.ACR_NAME }}"
      - name: build, push, sign (SBOM + provenance attached)
        env:
          REGISTRY: ${{ vars.ACR_NAME }}.azurecr.io
        run: |
          build() { # name dockerfile extra-args...
            local name=$1 file=$2; shift 2
            docker buildx build -f "$file" "$@" --sbom=true --provenance=true \
              -t "$REGISTRY/qarib-$name:$TAG" --push --metadata-file "meta-$name.json" .
            digest=$(python3 -c "import json;print(json.load(open('meta-$name.json'))['containerimage.digest'])")
            cosign sign --yes "$REGISTRY/qarib-$name@$digest"
          }
          build api   apps/api/Dockerfile
          build web   apps/web/Dockerfile --build-arg "NEXT_PUBLIC_SITE_URL=${{ vars.PUBLIC_URL }}"
          build admin apps/web/Dockerfile --build-arg APP=admin
          build ingest  services/Dockerfile --target ingest
          build matcher services/Dockerfile --target matcher

  dev:
    needs: [build]
    if: ${{ always() && vars.DEPLOY_ENABLED == 'true' && (needs.build.result == 'success' || inputs.environment == 'dev') }}
    uses: ./.github/workflows/deploy-env.yml
    with: { environment: dev }
    secrets: inherit

  staging:
    needs: [dev]
    if: ${{ always() && vars.DEPLOY_ENABLED == 'true' && (startsWith(github.ref, 'refs/tags/v') || inputs.environment == 'staging') && needs.dev.result != 'failure' }}
    uses: ./.github/workflows/deploy-env.yml
    with: { environment: staging }
    secrets: inherit

  production:
    needs: [staging]
    if: ${{ always() && vars.DEPLOY_ENABLED == 'true' && (startsWith(github.ref, 'refs/tags/v') || inputs.environment == 'production') && needs.staging.result != 'failure' }}
    uses: ./.github/workflows/deploy-env.yml
    with: { environment: production } # protect this GitHub Environment with required reviewers
    secrets: inherit
