name: Security
on:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    runs-on: ubuntu-latest
    strategy:
      matrix: { language: [javascript-typescript, python] }
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with: { languages: '${{ matrix.language }}' }
      - uses: github/codeql-action/analyze@v3

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pip-audit
      - run: pip install -e services/ingest -e services/matcher && pip-audit --skip-editable
        shell: bash

  trivy-and-iac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Run Trivy from its container image (the setup action was unreliable on hosted runners).
      - name: dependency + secret scan (HIGH/CRITICAL fail the build)
        run: |
          docker run --rm -v "$PWD":/src:ro aquasec/trivy:latest fs             --severity HIGH,CRITICAL --exit-code 1 --scanners vuln,secret             --skip-dirs '**/node_modules' --skip-dirs '**/.terraform' --skip-dirs '**/.next' /src
      - name: infrastructure-as-code misconfiguration scan
        run: |
          docker run --rm -v "$PWD":/src:ro aquasec/trivy:latest config             --severity HIGH,CRITICAL --exit-code 1 --skip-dirs '**/.terraform' /src/infra

  license-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: npx --yes license-checker-rseidelsohn --production --summary --failOn "GPL-2.0;GPL-3.0;AGPL-3.0"
