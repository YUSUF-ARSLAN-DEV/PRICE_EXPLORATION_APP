name: CI
on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: qarib
          POSTGRES_PASSWORD: qarib_local_only
          POSTGRES_DB: qarib
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U qarib" --health-interval 5s --health-timeout 3s
          --health-retries 10
      meilisearch:
        image: getmeili/meilisearch:v1.11
        env:
          MEILI_MASTER_KEY: local_master_key_change_me_32chars_min
          MEILI_NO_ANALYTICS: 'true'
        ports: ['7700:7700']
    env:
      DATABASE_URL: postgresql://qarib:qarib_local_only@localhost:5432/qarib
      REQUIRE_DB: '1' # db integration tests must run in CI, never silently skip
      MEILI_TEST_URL: http://localhost:7700
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: qarib
          POSTGRES_PASSWORD: qarib_local_only
          POSTGRES_DB: qarib
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U qarib" --health-interval 5s --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://qarib:qarib_local_only@localhost:5432/qarib
      REQUIRE_DB: '1' # ingestion integration tests must run in CI, never silently skip
    strategy:
      matrix:
        service: [ingest, matcher]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -e ../ingest -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src tests
      - run: pytest -q

  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: wagoid/commitlint-github-action@v6

  plan-deviation:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/check-plan-deviation.mjs
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: origin/${{ github.base_ref }}

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.9.8 }
      - run: terraform fmt -check -recursive infra/terraform
      - name: validate every root module
        run: |
          for d in bootstrap stack spike-azure-availability; do
            terraform -chdir=infra/terraform/$d init -backend=false -input=false
            terraform -chdir=infra/terraform/$d validate
          done

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck scripts/deploy/*.sh

  images:
    # Build every production image and run the whole system from them (plan 9.4/9.9).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build images
        run: |
          docker build -q -f apps/api/Dockerfile -t qarib-api:dev .
          docker build -q -f apps/web/Dockerfile -t qarib-web:dev .
          docker build -q -f apps/web/Dockerfile --build-arg APP=admin -t qarib-admin:dev .
          docker build -q -f services/Dockerfile --target ingest -t qarib-ingest:dev .
          docker build -q -f services/Dockerfile --target matcher -t qarib-matcher:dev .
      - name: start the stack
        run: docker compose -f docker-compose.stack.yml up -d --wait --wait-timeout 180
      - name: smoke test
        run: SMOKE_EXPECT_DATA=1 node scripts/smoke-stack.mjs
      - name: logs on failure
        if: failure()
        run: docker compose -f docker-compose.stack.yml logs --no-color --tail 200

  e2e:
    # Browser tests, accessibility, Lighthouse budgets, load and chaos against the production images (plan 10).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile --filter @qarib/e2e...
      - run: pnpm --filter @qarib/e2e exec playwright install --with-deps chromium
      - name: build images
        run: |
          docker build -q -f apps/api/Dockerfile -t qarib-api:dev .
          docker build -q -f apps/web/Dockerfile -t qarib-web:dev .
          docker build -q -f apps/web/Dockerfile --build-arg APP=admin -t qarib-admin:dev .
          docker build -q -f services/Dockerfile --target ingest -t qarib-ingest:dev .
          docker build -q -f services/Dockerfile --target matcher -t qarib-matcher:dev .
      - run: docker compose -f docker-compose.stack.yml up -d --wait --wait-timeout 180
      - name: browser + accessibility + chaos tests
        run: pnpm --filter @qarib/e2e test
      - name: lighthouse budgets (performance >= 90, accessibility/SEO/best-practices >= 95)
        run: pnpm --filter @qarib/e2e lighthouse
      - name: load test (search p95 < 300 ms)
        run: |
          docker compose -f docker-compose.stack.yml exec -T db psql -U qarib -d qarib -v ON_ERROR_STOP=1 < load/seed-large.sql
          docker compose -f docker-compose.stack.yml exec -T api node dist/jobs/run.js reindex
          docker run --rm -i --network host -e API=http://localhost:4000 -e WEB=http://localhost:3000 grafana/k6 run --quiet - < load/api.js
      - name: upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with: { name: playwright-report, path: e2e/playwright-report, retention-days: 7 }
      - name: logs on failure
        if: failure()
        run: docker compose -f docker-compose.stack.yml logs --no-color --tail 200
