name: Deploy one environment
on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      TAG: ${{ github.event.inputs.tag || github.sha }}
      PUBLIC_URL: ${{ vars.PUBLIC_URL }}
      ADMIN_URL: ${{ vars.ADMIN_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: promote the signed image to this environment's registry (no rebuild)
        if: ${{ inputs.environment != 'dev' }}
        env:
          SRC_ACR: ${{ vars.SOURCE_ACR_NAME }}
          DST_ACR: ${{ vars.ACR_NAME }}
        run: |
          for n in api web admin ingest matcher; do
            az acr import --name "$DST_ACR" --source "$SRC_ACR.azurecr.io/qarib-$n:$TAG" \
              --image "qarib-$n:$TAG" --force
          done
      - name: verify image signatures before rollout
        run: |
          curl -sSL https://github.com/sigstore/cosign/releases/latest/download/cosign-linux-amd64 -o cosign && chmod +x cosign
          for n in api web admin ingest matcher; do
            ./cosign verify --certificate-identity-regexp "https://github.com/${{ github.repository }}/.*" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "${{ vars.ACR_NAME }}.azurecr.io/qarib-$n:$TAG" >/dev/null
          done
      - name: deploy (migrate -> jobs -> canary api -> canary web -> admin -> smoke)
        run: scripts/deploy/deploy.sh "${{ inputs.environment == 'production' && 'prod' || inputs.environment }}" "$TAG"
