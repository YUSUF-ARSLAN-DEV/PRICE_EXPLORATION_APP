[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qarib-matcher"
version = "0.2.0"
description = "Qarib product matching & normalisation (Phase 4)."
requires-python = ">=3.12"
# qarib-ingest (shared normalisers, DB helpers) is a local package:
#   pip install -e ../ingest -e ".[dev]"
dependencies = ["rapidfuzz>=3.9", "psycopg[binary]>=3.2", "pydantic>=2.9"]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
embeddings = ["sentence-transformers>=3.0"]
dev = ["pytest>=8", "ruff>=0.8", "mypy>=1.13"]

[project.scripts]
qarib-match = "qarib_matcher.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S608", "E501", "UP031"]
"scripts/*" = ["S311", "E501"]
"src/qarib_matcher/dictionaries.py" = ["E501"]

[tool.mypy]
strict = true
python_version = "3.12"

[[tool.mypy.overrides]]
module = ["rapidfuzz.*", "sentence_transformers.*", "anthropic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
