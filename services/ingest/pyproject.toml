[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qarib-ingest"
version = "0.2.0"
description = "Qarib ingestion workers (Phase 3). Only APPROVED sources may run - see plan.txt P2."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9", "httpx>=0.27", "psycopg[binary]>=3.2"]

[project.optional-dependencies]
azure = ["azure-storage-blob>=12.19"]
dev = ["pytest>=8", "ruff>=0.8", "mypy>=1.13", "azure-storage-blob>=12.19"]

[project.scripts]
qarib-ingest = "qarib_ingest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qarib_ingest = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
# S101: asserts are used for type narrowing on DB rows, not for validation.
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S608", "E501", "UP031"]

[tool.mypy]
strict = true
python_version = "3.12"

[[tool.mypy.overrides]]
module = ["azure.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
